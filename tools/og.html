<!doctype html>
<!-- Prévia de link (og.jpg, 1200×630), renderizada por tools/og.py.
     O essencial (foto em arco + nome) fica no quadrado central de 630 px, porque o WhatsApp
     muitas vezes mostra a prévia como miniatura quadrada cortada no meio. -->
<html lang="pt-BR">
<head>
<meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Manrope:wght@500;600&family=Playfair+Display:ital,wght@1,400&display=swap" rel="stylesheet">
<style>
  :root{--cafe:#16110d;--cafe-2:#211913;--creme:#f6f1ea;--areia:#d2bea3;--caramelo-2:#d6a670}
  *{box-sizing:border-box}
  html,body{margin:0;width:1200px;height:630px;overflow:hidden}
  body{position:relative;background:radial-gradient(ellipse 60% 80% at 50% 45%,#2a2018 0%,var(--cafe-2) 40%,var(--cafe) 100%);
    font-family:Manrope,sans-serif;color:var(--creme);-webkit-font-smoothing:antialiased}
  .fumaca{position:absolute;top:-40px;height:720px;width:520px;object-fit:cover;mix-blend-mode:screen;opacity:.55}
  .fumaca--e{left:-60px}
  .fumaca--d{right:-60px;transform:scaleX(-1)}
  .moldura{position:absolute;inset:22px;border:1px solid rgba(214,166,112,.28)}
  .arco{position:absolute;left:435px;top:46px;width:330px;height:452px;border-radius:165px 165px 0 0;overflow:hidden;
    box-shadow:0 40px 80px -30px rgba(0,0,0,.8)}
  .arco img{width:100%;height:100%;object-fit:cover;object-position:50% 20%;display:block}
  .arco::after{content:"";position:absolute;inset:0;background:linear-gradient(0deg,rgba(22,17,13,.55),rgba(22,17,13,0) 32%)}
  .arco-fio{position:absolute;left:423px;top:34px;width:354px;height:476px;border:1px solid rgba(214,166,112,.6);border-bottom:0;border-radius:177px 177px 0 0}
  .nome{position:absolute;left:0;right:0;top:532px;display:flex;flex-direction:column;align-items:center;gap:14px}
  .nome img{width:290px;height:auto}
  .nome span{font:600 12.5px/1 Manrope,sans-serif;letter-spacing:.34em;text-transform:uppercase;color:var(--caramelo-2)}
  .lado{position:absolute;top:0;bottom:0;width:250px;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center}
  .lado--e{left:62px}
  .lado--d{right:44px;width:226px}
  .rr{width:176px;height:auto}
  .fio{width:56px;height:1px;background:var(--caramelo-2);opacity:.7;margin:26px 0 0}
  .frase{font:italic 400 31px/1.24 "Playfair Display",serif;color:var(--creme);margin:0}
  .frase em{color:var(--caramelo-2)}
  .local{margin-top:22px;font:500 12.5px/1 Manrope,sans-serif;letter-spacing:.3em;text-transform:uppercase;color:var(--areia)}
</style>
</head>
<body>
  <img class="fumaca fumaca--e" src="../assets/img/fumaca-poster.webp" alt="">
  <img class="fumaca fumaca--d" src="../assets/img/fumaca-poster.webp" alt="">
  <div class="moldura"></div>

  <div class="lado lado--e">
    <img class="rr" src="../assets/img/logo-rr.png" alt="">
    <div class="fio"></div>
  </div>

  <div class="arco-fio"></div>
  <div class="arco"><img src="../../hero-para-melhorar/roni-hero-hd.png" alt=""></div>

  <div class="nome">
    <img src="../assets/img/logo-nome.png" alt="Roni Romano">
    <span>Hair design · Visagismo</span>
  </div>

  <div class="lado lado--d">
    <p class="frase">Corte, cor e imagem a partir dos <em>seus traços</em></p>
    <div class="fio"></div>
    <p class="local">Morumbi · SP</p>
  </div>
</body>
</html>
